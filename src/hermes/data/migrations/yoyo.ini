[DEFAULT]
sources = .
database = postgresql+psycopg://%(tsdb_user)s:%(tsdb_password)s@%(tsdb_host)s:%(tsdb_port)s/%(tsdb_db)s
batch_mode = on
verbosity = 2
# %(tsdb_user)s etc. resolve from OS env vars (yoyo lowercases all keys).
# Variables are sourced from infra/.env by scripts/migrate.sh before yoyo runs.
# No credentials appear in command-line arguments (ps aux safe).
# postgresql+psycopg:// scheme required — project uses psycopg v3, not psycopg2.
